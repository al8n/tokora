name: perf

# ── THE PERFORMANCE LANE ────────────────────────────────────────────────────────────────────
#
# `bench (smoke)`, `instruction counts` and `wall clock (advisory)` were jobs of `CI` until
# 2026-11-13, when the owner asked for them to be split out. GitHub pauses a WORKFLOW, never a
# job, so while the three shared `ci.yml` a performance lane could only be paused by pausing every
# correctness gate along with it. In a workflow of their own they can be paused and resumed
# without touching anything `CI` decides.
#
# ── A SCHEDULING CHANGE, NOT A COVERAGE CHANGE ──────────────────────────────────────────────
#
# Every job below runs exactly what it ran in `CI`: the same steps under the same check names,
# the same `if:` and `continue-on-error`, on the same triggers, `paths-ignore` and concurrency
# rule, with the workflow `env` its steps read. The `wallclock_plant` dispatch input came along
# with the `wall clock` job, its only reader. The jobs' headers moved with them and hold here as
# written: the job "above" or "below" is still where they say, and "this workflow" in them is now
# this one, so dispatching `perf` on `main` is what re-checks both gates' floors.
#
# What changed is whose conclusion they set. `CI`'s no longer waits for any of the three, and a
# red here reds this workflow's run instead:
#
#   * `bench (smoke)` runs on every trigger, as before, so `perf` reports wherever `CI` does. A
#     bench that stops building or panics under `--test` now reds `perf`, not `CI`. `CI` still
#     lints all five (`clippy --workspace --all-targets`) and type-checks them at the MSRV
#     (`msrv`); it executes none of them.
#   * `instruction counts` is REQUIRED as before, not advisory: no `continue-on-error`, pull
#     requests and dispatches only. A red here is answered the way its header says, by a fix or
#     by a `Perf-accept:` trailer, and is not one to read past.
#   * `wall clock (advisory)` is advisory as before: its red is reported on the job and fails
#     nothing.
#
# The release does not ask for this workflow. It is performance, not correctness, and one of its
# three jobs is advisory by design; `release.yml` says so where it lists what it asks for.
#
# ── PAUSING IT ──────────────────────────────────────────────────────────────────────────────
#
# A pause is a setting on GitHub, not a line in this repository, and a paused lane reports
# nothing: `CI` stays green, the release never asked, and nothing here records that the lane is
# off. So a pause is a decision with an end, not a way to quiet a red, and while it lasts nothing
# executes the benches, counts an instruction or reads a clock. If a repository rule requires one
# of these three check names, a pause also holds every pull request on a check that will never
# report; lift the rule with the pause.

# Triggers, `paths-ignore` and the concurrency rule are deliberately identical to
# `.github/workflows/ci.yml`; read the comments there for why the ignore list carries no blanket
# `**.md` (the guide chapters under `tokora/src/guide/` and `README.md` are `include_str!`'d, so
# they are code here). The dispatch input is the one difference: it left `CI` with its only
# reader, the `wall clock` job.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "README"
      - "COPYRIGHT"
      - "LICENSE-*"
      - "*.txt"
  pull_request:
    paths-ignore:
      - "README"
      - "COPYRIGHT"
      - "LICENSE-*"
      - "*.txt"
  workflow_dispatch:
    inputs:
      wallclock_plant:
        description: >-
          Apply one of ci/wallclock/plants/*.py to the HEAD side of the `wall clock` job's
          extracted work tree, to watch that gate fire (or correctly not fire). Leave empty for
          a plain self-comparison, which is what re-derives its threshold.
          Names a file in that directory without its extension: `alloc_per_token` is a heap
          allocation added to the per-token path, which this gate must catch; `docs_only` is
          prose, which it must not.
        required: false
        type: string
        default: ""
  schedule:
    - cron: "0 1 1 * *"

concurrency:
  # Same expression as `CI`'s, for the reasons its comment gives in full (#141): one in-flight
  # run per ref, except on `main`, where the group is keyed on the commit SHA so that every main
  # commit gets its own group and its own verdict. `${{ github.workflow }}` leading the group is
  # what keeps this lane's groups apart from every other workflow's, so no lane can cancel
  # another's run.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && github.sha || '' }}
  cancel-in-progress: ${{ !(github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}

# The workflow `env` these three jobs read, carried over from `CI` verbatim. Cargo reads all three,
# and `ci/icount/run.sh` and `ci/wallclock/run.sh` extend `RUSTFLAGS` rather than replace it, so
# both gates build under the `-Dwarnings` they built under in `CI`. `CI`'s `nightly` / `stable`
# entries are not carried: nothing in either workflow, or in any script, reads them.
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: 1

jobs:
  # ── Gate: bench SMOKE only ──────────────────────────────────────────────────
  #
  # Compiles every declared bench target and runs each once in test mode (`-- --test`), which
  # runs every benchmark body once instead of criterion's real sampling loop (#181).
  #
  # ── THE FEATURE INCANTATION IS GONE, AND SO IS THE SKIP IT GUARDED ──────────
  # This line used to read `cargo bench --no-default-features --features
  # std,logos,rowan,unstable-raw,combinators -- --test`, hand-maintained to equal the union of
  # the five `[[bench]]` sections' `required-features` in `tokora/Cargo.toml`. #216 moved the
  # benches into `tokora-benches`, which pins that feature point on its `tokora` dependency
  # instead, so the bench targets declare no `required-features` at all — and a bench with no
  # required features cannot be SKIPPED, which is the #181 failure this job exists to close (a
  # bench whose features are unmet is skipped, not failed: the job once compiled one of five
  # targets and reported `Finished` in ~30ms). The hazard is now removed by construction rather
  # than by a list two files apart having to agree.
  #
  # ── WHAT REPLACES IT ────────────────────────────────────────────────────────
  # A different silent shape takes its place: `cargo bench -p tokora-benches` is a package
  # selection with no target filter, so a `[[bench]]` section that is deleted, renamed or
  # mis-pathed just makes the job build fewer targets and still report success. So the step
  # below does not use the bare form. It reads the bench target list out of `cargo metadata` and
  # passes each as an explicit `--bench NAME` — which ERRORS on a name cargo cannot find, where
  # `--benches` would shrug — and refuses to run at all if the list it got back is shorter than
  # the five targets that exist today. Deriving the list rather than hardcoding it is what keeps
  # a SIXTH bench from being silently unbuilt; the floor is what keeps one of the five from
  # silently disappearing. Raise the floor when a bench is added.
  #
  # NOT a timed regression gate, and still not: this step runs each id once, under `--test`, and
  # reads no number at all. GitHub runners remain far too noisy for the ±2% discipline these
  # benches are held to locally, so numbers at that resolution are still gathered off-CI.
  #
  # Two jobs below do carry regression gates, and they are not substitutes for each other or for
  # this one. `icount` counts instructions rather than seconds, over the repetition combinators
  # only, and resolves 1%. `wall clock (advisory)` times these same five targets in a same-run
  # A/B and resolves something coarse — a cache cliff, an allocation added per element — which is
  # exactly the class an instruction count is blind to. These five benches also cover surfaces
  # `tokora-icount` does not touch at all (the scanner protocol, the typed pratt driver, the CST
  # builder, the raw checkpoint triple). Adding a bench here adds an id to the wall-clock gate
  # and does not add an axis to `icount`; adding a workload there does the reverse.
  bench-smoke:
    name: bench (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-bench-
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: cargo bench -p tokora-benches, every declared target named explicitly, -- --test
        run: |
          set -euo pipefail
          cargo metadata --no-deps --format-version 1 > /tmp/meta.json
          python3 - /tmp/meta.json > /tmp/bench_targets.txt <<'PY'
          import json, sys

          # The floor. It is the count that exists today, asserted rather than assumed: a
          # `[[bench]]` section that goes missing is not a smaller job, it is an unbuilt bench.
          EXPECTED_AT_LEAST = 5

          meta = json.load(open(sys.argv[1], encoding="utf-8"))
          pkgs = [p for p in meta["packages"] if p["name"] == "tokora-benches"]
          if len(pkgs) != 1:
              sys.exit(
                  "::error::expected exactly one workspace package named `tokora-benches`, "
                  "found %d — the bench package was renamed or dropped from the member list"
                  % len(pkgs)
              )
          names = sorted(t["name"] for t in pkgs[0]["targets"] if t["kind"] == ["bench"])
          if len(names) < EXPECTED_AT_LEAST:
              sys.exit(
                  "::error::tokora-benches declares %d bench targets, expected at least %d: %s"
                  % (len(names), EXPECTED_AT_LEAST, names)
              )
          print("\n".join(names))
          PY
          mapfile -t names < /tmp/bench_targets.txt
          # Re-checked in the shell as well as in python: `mapfile` from a file a dead python
          # left empty would otherwise leave `args` empty, and a bare `cargo bench
          # -p tokora-benches` runs everything and reports success — the exact silent shape this
          # step is built to refuse.
          if [ "${#names[@]}" -lt 5 ]; then
            echo "::error::read ${#names[@]} bench target names, expected at least 5"
            exit 1
          fi
          args=()
          for n in "${names[@]}"; do args+=(--bench "$n"); done
          echo "bench (smoke): ${#names[@]} named targets — ${names[*]}"
          cargo bench -p tokora-benches "${args[@]}" -- --test

  # ── Gate: instruction counts over the repetition matrix ─────────────────────
  #
  # `bench (smoke)` above says why the criterion benches are not a regression gate: a GitHub
  # runner's wall clock is far too noisy for the ±2% discipline those benches are held to. This
  # job is the other half of that sentence. It measures the same repetition engines with an
  # instrument that has NO noise — callgrind counts the instructions a binary executes, which is
  # a property of the binary and not of the machine it ran on, so a loaded runner and an idle one
  # return the same number.
  #
  # It exists because #259 consolidates 259 files and 338 `impl` blocks of
  # `tokora/src/combinator/many` into shared engines, under a requirement that performance be
  # unchanged. That matrix exists BECAUSE each combination is monomorphised, so consolidating it
  # is exactly the shape that loses inlining — and "did we lose inlining" is what an instruction
  # count directly answers. The criterion benches cannot: the repetition engine is a third to a
  # half of each of them and their run-to-run spread is 4.3-4.8%, so the smallest engine
  # regression they can distinguish from noise is around 9-10%. This gate sees 1%.
  #
  # That sentence is now also a job: `wall clock (advisory)` below reads those same benches with a
  # clock, at that coarse resolution, precisely because an instruction count cannot see a cache
  # cliff or an allocation added to a hot loop. The two answer different questions and neither
  # subsumes the other. This one is required and that one is not, and the reason is in its header:
  # this gate's self-comparison is exactly zero, and that gate's is a spread.
  #
  # ── WHY THERE IS NO COMMITTED BASELINE ─────────────────────────────────────────────────────
  #
  # Both sides are built and measured inside this one job, on this one runner, with this one
  # toolchain. `ci/icount/run.sh`'s header carries the argument in full; the short form is that
  # instruction counts are deterministic GIVEN a toolchain and drift on every rustc upgrade, std
  # change and dependency bump. A checked-in baseline turns each of those into a red gate for a
  # change nobody made, and a gate that reds for reasons nobody caused is a gate that gets
  # disabled — which is strictly worse than never building it. A same-run A/B cancels the drift
  # because both sides meet the same compiler.
  #
  # ── REQUIRED, NOT ADVISORY ─────────────────────────────────────────────────────────────────
  #
  # A failure here reds the run: this workflow's since the split, not `CI`'s, and the header at
  # the top of this file says what that changes. The usual reason to start a performance gate
  # advisory is that it is expected to false-positive; this one structurally cannot, because the
  # self-comparison — the same commit built twice and measured twice — comes back at exactly zero
  # difference on every workload. An advisory perf job is a job nobody reads.
  #
  # What it costs is that a DELIBERATE trade needs a way through, or the gate's first collision
  # with one gets resolved by deleting the gate. The way through is a `Perf-accept:` trailer in a
  # commit on the branch; `run.sh` harvests them from `$merge_base..HEAD`, so an acceptance
  # licenses the commits it travels with and is gone from the next branch's range. It cannot
  # silently become a standing allowance for a workload the way a checked-in exemption file
  # would — which against a merge-base comparison that resets every time is an unbounded
  # allowance written as a bounded one. `compare.py` prints the exact trailer to add when it
  # fails, and refuses one that carries no reason.
  #
  # ── THE SELF-TEST RUNS FIRST, AND IS NOT OPTIONAL ──────────────────────────────────────────
  #
  # `measure.py` is watched by its own reading: a broken callgrind parse gives an absurd number
  # or none at all, and `--linearity` refuses to report on a curve that is not a line. The
  # DECISION logic has no such witness — a `compare.py` that returned 0 on everything would
  # leave this job green, the table printed, the numbers right, and the gate off. So
  # `ci/icount/compare_selftest.sh` runs before anything is built, over synthetic readings, in
  # about a second. It has been watched going red rather than merely written: degenerating the
  # acceptance ceiling into "a trailer exists" reds one case, and short-circuiting the verdict
  # to pass reds three.
  #
  # ── PULL REQUESTS ONLY, AND NO PATH FILTER ─────────────────────────────────────────────────
  #
  # `pull_request` is where a merge-base is defined. Every commit that reaches `main` came
  # through a PR this job already examined, so running it again on the push adds a second reading
  # of the same delta — and on a squash merge it would have to find the branch's `Perf-accept:`
  # trailers inside a message GitHub composed, which is a way for `main` to go red over
  # bookkeeping. `workflow_dispatch` is kept: dispatching this workflow ON `main` makes HEAD its
  # own merge-base, which runs the self-comparison and re-checks the zero the threshold rests on.
  #
  # There is deliberately NO `paths:` filter narrowing this to `tokora/src/combinator/**`. The
  # repetition engines are generic over the lexer, the emitter, the container and `InputRef`, and
  # they are `#[inline]`-heavy across all four: a change in `tokora/src/input/`, `src/lexer/`,
  # `src/container/`, `src/emitter/` or a dependency requirement in `tokora/Cargo.toml` can cost
  # them their inlining without touching a file under `combinator/many/`. A filter narrower than
  # the code a gate protects is the defect this repository has hit six times (#181, #195, #200,
  # #208, #217, #220), and it would exempt exactly the regressions that are hardest to attribute.
  icount:
    name: instruction counts
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
        with:
          # Both revisions are read out of this clone with `git archive`, and the merge-base is
          # computed here rather than taken from the event payload — see `run.sh`. A shallow
          # clone has neither.
          fetch-depth: 0
      - name: compare.py self-test, before anything is built
        run: bash ci/icount/compare_selftest.sh
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          # The registry only. The two target directories live under `RUNNER_TEMP` and are
          # deliberately not cached: a restored artefact from another toolchain is the one thing
          # that could make the two sides of this comparison differ for a reason that is not the
          # branch.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-icount-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-icount-
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: Install valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind
          valgrind --version
      - name: Instruction counts, this branch against its merge-base
        run: bash ci/icount/run.sh "${{ github.event.pull_request.base.sha || 'origin/main' }}"
      - name: Upload both sides' readings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # The head side's file is the per-axis baseline #259 starts from, so it is kept
          # whether the job passed or failed.
          name: icount-readings
          path: ${{ runner.temp }}/icount/*.json
          if-no-files-found: warn

  # ── Gate (advisory): wall clock over the criterion benches ──────────────────
  #
  # The `icount` job above counts instructions, which is a property of the binary and not of the
  # machine — and that is exactly what it cannot see. An instruction count does not know where
  # those instructions read from. A change that keeps `Ir` to the byte can still fall off a
  # cache, lose a branch predictor, add an allocation to a hot loop, or move data it used not to
  # move, and cost real time for every one of them. This job is the other half of that sentence,
  # and it is the ONLY half it is: a coarse layer, over the five criterion benches, measured with
  # a clock.
  #
  # ── WHAT IT CAN ACTUALLY SEE, MEASURED ─────────────────────────────────────────────────────
  #
  # Not the ±2% the benches are held to locally, and not the 1% the `icount` job resolves. The
  # number is 25%, and it was measured here rather than reasoned about — the reasoning had it at
  # 9-10% and the reasoning was wrong about WHY.
  #
  # **Two self-comparisons, 2026-08-29, `ubuntu-latest`.** Same commit on both sides through the
  # whole pipeline, 46 ids, 5 interleaved rounds a side. Job wall time **9m27s** and **9m15s**, of
  # which 6m30s and 6m21s was measurement and the rest two cold builds; peak disk about 700 MB.
  #
  #   | run         | median | p90   | ids over 5% | max     | same build, round to round |
  #   |-------------|--------|-------|-------------|---------|----------------------------|
  #   | 33225301618 | 0.36%  | 1.35% | 1 of 46     | 16.22%  | median 1.39%, worst 21.87% |
  #   | 33226885912 | 0.19%  | 2.40% | 1 of 46     |  5.01%  | median 3.16%, worst 30.79% |
  #
  # The medians are far better than expected. Criterion's own spread on these targets is 4.3-4.8%
  # ON A DEDICATED MACHINE; interleaved min-of-5 on a shared runner beats that by an order of
  # magnitude on the median id, out of per-round readings that themselves range over 30%. The
  # estimator is doing exactly what it was chosen to do, and the second run makes the point
  # sharply: it was the NOISIER of the two per round and the QUIETER of the two after folding.
  #
  # The maxima are what set the threshold, and they are not noise. In the first run
  # `input/backtrack/stacked_savepoint_cycle` came back +16.22% with each side's five rounds
  # stable to 0.81% and the two clusters COMPLETELY DISJOINT — base 672-677 us in every round,
  # head 781-788 us in every round. Noise overlaps; this does not.
  #
  # **It is not codegen**, and establishing that needed a diagnostic the first run did not have.
  # `run.sh` now prints whether the two sides' binaries are the same object, and the second run
  # says they are **byte-identical on all five targets** — `--remap-path-prefix` maps two
  # equal-length directories to one string, so a self-comparison runs ONE PROGRAM against itself.
  # Whatever moved that row 16% was per-process placement: where the loader mapped the image,
  # where the allocator's arenas landed, how the stack aligned.
  #
  # **And it is intermittent.** The second run put the same id at -0.15% and the whole population
  # under 5.01%. So the outlier belongs to a process rather than to a benchmark, it appeared in one
  # run of two, and no number of rounds within a run sees past it — within a run it is stable to
  # under 1%.
  #
  # So the claim is deliberately modest, and modest for a reason that is now named: this job sees
  # an allocation added per element, or a data-movement or cache change of that size. It cannot
  # support a claim about ONE id moving 20%, because placement alone moved one id 16% with nothing
  # changed — and 16.22% is a LOWER bound for a real comparison, which runs two DIFFERENT binaries
  # and so adds the codegen placement these two runs were able to exclude. When the two perf jobs
  # disagree, `icount` is the tighter statement about what the compiler did, and it is immune to
  # placement in both senses, which is precisely why it never had to discover any of this.
  #
  # ── SAME-RUN A/B, NO COMMITTED BASELINE ────────────────────────────────────────────────────
  #
  # Same decision as the `icount` job, for a reason that is strictly stronger here. Instruction
  # counts drift with the toolchain; wall-clock times do not travel between HOSTS at all, and
  # GitHub hands out several CPU generations under one `ubuntu-latest` label. A checked-in
  # baseline would be comparing this run's host against whichever host last wrote the file, which
  # is a red gate for a change nobody made — and a gate that reds for reasons nobody caused is a
  # gate that gets disabled. Both sides are built and measured inside this one job.
  #
  # And the same trick makes it mean what it is read to mean: the base side is not a checkout of
  # the merge-base, it is this branch's tree with `tokora/` swapped for the merge-base's. The
  # instrument — fixtures, ids, iteration counts, measurement window — is the constant and the
  # library is the variable. `ci/wallclock/run.sh`'s header carries the argument in full.
  #
  # ── ADVISORY, AND WHAT WOULD PROMOTE IT ────────────────────────────────────────────────────
  #
  # `continue-on-error: true`, the same mechanism `CI`'s `semver-checks (advisory)` uses: a red
  # here does not fail the run and does not block a merge.
  #
  # That is not modesty, it is the honest reading of the evidence above. The `icount` job is
  # required because its self-comparison comes back at EXACTLY ZERO on every workload — it
  # structurally cannot false-positive. This one cannot make that claim: its self-comparison is a
  # spread, not a zero, and the threshold is a bet that the spread stays where it was measured.
  # A performance gate promoted to required before its false-positive rate is known is the gate
  # that reds during a bad week on GitHub's fleet and gets deleted in the pull request that was
  # trying to ship something else.
  #
  # What would justify promoting it, in order, and the first item is now a specific question
  # rather than a general one:
  #
  #   1. **More self-comparisons, to characterise the placement outlier.** Two runs produced
  #      maxima of 16.22% and 5.01%, on different ids, from byte-identical binaries — so it is
  #      intermittent and it belongs to a process, not to a benchmark. Two samples of a tail say
  #      almost nothing about its shape. Dispatch this workflow — a dispatch is a `--self` run —
  #      on several days and tabulate the largest id each time. If ten runs stay under 20%, 25% is
  #      defensible and can come down; if one reaches 30%, it has to go up.
  #   2. **A false-positive count.** Thirty consecutive pull requests whose verdict agrees with
  #      `icount` and with review — no row over the threshold that a human then had to wave
  #      through. Two good weeks is not evidence.
  #   3. **A rule that survives (1).** The obvious tightening is to require corroboration — two
  #      ids over the threshold rather than one — because placement hit ONE id and the planted
  #      allocation hit twenty-six. That would let the threshold drop a long way. It is not
  #      shipped, because a decision rule invented from a single run is a rule written against the
  #      last defect, and this one would have to be measured against false NEGATIVES before it
  #      could be trusted: a regression confined to one bench is exactly what it would stop
  #      seeing.
  #
  # Until then, a red here is a prompt to look, and `Perf-accept:` is how a deliberate trade is
  # recorded — the same trailer, with the same one-shot lifetime, that the `icount` job reads.
  #
  # ── THE SELF-TEST RUNS FIRST, AND MATTERS MORE HERE ────────────────────────────────────────
  #
  # `ci/wallclock/compare_selftest.sh` runs before anything is built, over synthetic readings, in
  # about a second. A `compare.py` that returned 0 on everything would leave this job green, the
  # table printed and the gate off — and an ADVISORY job's green is the one nobody is waiting on,
  # so nothing else would notice. It has been watched going red rather than merely written: the
  # verdict short-circuited to pass reds ten cases, an acceptance that ignores its ceiling reds
  # one, the self-comparison taking a signed maximum instead of an absolute one reds one, and
  # replacing either half of the min-of-N estimator with a mean reds three.
  #
  # ── PULL REQUESTS AND DISPATCH, AND WHAT EACH ONE MEANS ────────────────────────────────────
  #
  # On a `pull_request` it is an A/B against the merge-base. On `workflow_dispatch` it is a
  # SELF-comparison — the same commit on both sides — because that is the calibration the
  # threshold rests on and there is no other way to run it. `wallclock_plant` optionally applies
  # one of `ci/wallclock/plants/*.py` to the head side of the extracted work tree, which is how
  # this gate is watched firing on a regression and staying quiet on a change that is not one
  # without either plant ever reaching a commit. `alloc_per_token` must fire, `docs_only` must
  # not, and `WALLGATE_PLANT_RATE` sizes the first — so the threshold's meaning can be measured by
  # raising it until the gate loses the regression, rather than asserted.
  #
  # There is deliberately no `paths:` filter. The benches reach the scanner, the lexer, the
  # container, the emitter, the CST builder and the checkpoint triple, and a cache regression in
  # any of them is what this job exists to see. A filter narrower than the code a gate protects
  # is the defect this repository has hit six times (#181, #195, #200, #208, #217, #220).
  wallclock:
    name: wall clock (advisory)
    runs-on: ubuntu-latest
    # Advisory: the same mechanism `CI`'s `semver-checks (advisory)` uses. A failure is reported
    # on the job and does not fail the run.
    continue-on-error: true
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
        with:
          # Both revisions are read out of this clone with `git archive`, and the merge-base is
          # computed here rather than taken from the event payload. A shallow clone has neither.
          fetch-depth: 0
      - name: compare.py self-test, before anything is built
        run: bash ci/wallclock/compare_selftest.sh
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          # The registry only. The two target directories live under `RUNNER_TEMP` and are
          # deliberately not cached — a restored artefact from another toolchain is the one thing
          # that could make the two sides of this comparison differ for a reason that is not the
          # branch, and for a comparison of TIMES it would also be a restored artefact whose code
          # layout nothing in this run chose.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-wallclock-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-wallclock-
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: Wall clock, this branch against its merge-base
        env:
          # On a dispatch there is no merge-base to speak of, and the reason to dispatch this
          # workflow is to re-derive the floor — so a dispatch is a self-comparison.
          WALL_BASE: ${{ github.event.pull_request.base.sha || '--self' }}
          WALL_PLANT: ${{ inputs.wallclock_plant }}
        run: |
          set -euo pipefail
          if [ -n "${WALL_PLANT:-}" ]; then
            bash ci/wallclock/run.sh "$WALL_BASE" --plant "$WALL_PLANT"
          else
            bash ci/wallclock/run.sh "$WALL_BASE"
          fi
      - name: Upload the interleaved readings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # Every round of every side, not just the folded verdict: the minimum discards the
          # rounds it did not pick, and those rounds are the record of what the runner was doing
          # while this job ran. Kept whether the job passed or failed.
          name: wallclock-readings
          path: ${{ runner.temp }}/wallclock/readings.jsonl
          if-no-files-found: warn
